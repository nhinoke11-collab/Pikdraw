  <line x1="1265" y1="322" x2="1542" y2="322" class="stroke"/>
  <text x="1266" y="346" class="light label">Văn bản</text>
  <rect x="1266" y="357" width="277" height="31" rx="4" class="field"/><text x="1280" y="378" class="light small">Segoe UI Bold</text><text x="1520" y="378" class="muted small">▾</text>
  <rect x="1266" y="398" width="127" height="31" rx="4" class="field"/><text x="1280" y="419" class="light small">240 pt</text>
  <rect x="1405" y="398" width="138" height="31" rx="4" class="field"/><text x="1418" y="419" class="light small">Tracking: 20</text>
