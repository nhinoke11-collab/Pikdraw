<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">PikDraw — blueprint workspace desktop</title>
  <desc id="desc">Bố cục desktop với bốn workspace Vector, In ấn, Thi công và 3D. Canvas trung tâm lớn, công cụ trái, thuộc tính trên và inspector cùng layers bên phải. Đây là hình minh họa kiến trúc giao diện, không phải ứng dụng đang hoạt động.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#c5cbd6"/></pattern>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12656e"/><stop offset="1" stop-color="#092b43"/></linearGradient>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .light { fill: #eef2f9; }
      .muted { fill: #aeb8c9; }
      .dark { fill: #253146; }
      .small { font-size: 13px; }
      .label { font-size: 15px; }
      .heading { font-size: 18px; font-weight: 600; }
      .stroke { stroke: #4b586d; stroke-width: 1; }
      .tool { fill: none; stroke: #d4dce9; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .field { fill: #1d2636; stroke: #42506a; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#101723"/>
  <text x="40" y="47" class="light" font-size="29" font-weight="700">PikDraw</text>
  <text x="185" y="47" class="muted" font-size="20">Một tài liệu · Bốn workspace · Plugin dùng chung giao diện</text>
  <text x="40" y="79" class="muted label">BLUEPRINT DESKTOP — tỷ lệ thử nghiệm, chưa phải giao diện đã triển khai</text>

  <rect x="40" y="108" width="1520" height="804" rx="12" fill="#263145" stroke="#48566d"/>
  <!-- Window/title and menu -->
  <path d="M52 108H1548Q1560 108 1560 120V149H40V120Q40 108 52 108" fill="#202a3a"/>
  <rect x="58" y="119" width="24" height="22" rx="5" fill="#35d0b2"/>
  <text x="65" y="135" fill="#102b32" font-size="16" font-weight="700">P</text>
  <text x="94" y="135" class="light label">PikDraw · Biển hiệu An Phát</text>
  <text x="535" y="135" class="muted small">Tệp</text><text x="588" y="135" class="muted small">Chỉnh sửa</text>
  <text x="678" y="135" class="muted small">Đối tượng</text><text x="770" y="135" class="muted small">Công cụ</text>
  <text x="850" y="135" class="muted small">Plugin</text>
  <rect x="1030" y="117" width="328" height="27" rx="6" class="field"/>
  <text x="1045" y="136" class="muted small">Tìm lệnh hoặc công cụ…</text><text x="1290" y="136" class="muted small">Ctrl + K</text>
  <text x="1441" y="136" class="muted label">—</text><rect x="1481" y="123" width="10" height="10" fill="none" stroke="#aeb8c9"/>
  <path d="M1525 123l10 10m0-10l-10 10" stroke="#aeb8c9"/>
  <!-- Workspace -->
  <rect x="40" y="149" width="1520" height="48" fill="#273348"/>
  <rect x="57" y="157" width="124" height="33" rx="6" fill="#344d5a"/>
  <rect x="57" y="186" width="124" height="3" fill="#35d0b2"/>
