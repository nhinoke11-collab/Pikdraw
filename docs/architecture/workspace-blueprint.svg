  <text x="805" y="898" class="muted small">Màu: ICC profile mẫu</text><text x="1042" y="898" class="muted small">Preflight: cần chạy</text><text x="1356" y="898" class="muted small">25%   −  ▬  +</text>
  <!-- Explanation -->
  <text x="40" y="949" class="light label" font-weight="600">Nguyên tắc layout</text>
  <text x="204" y="949" class="muted label">Canvas ưu tiên · Dock theo ngữ cảnh · Công cụ mở rộng qua command registry</text>
  <text x="40" y="976" class="muted small">Các nội dung bản vẽ, trạng thái lưu, kích thước và thuộc tính là dữ liệu minh họa. Layout có thể resize, collapse và reset theo workspace.</text>
