  <text x="285" y="570" fill="white" font-size="76" font-weight="700" letter-spacing="2">AN PHÁT</text>
  <text x="289" y="617" fill="#d3ece7" font-size="22">Thiết kế đẹp · Sản xuất chính xác</text>
  <rect x="289" y="650" width="186" height="35" rx="5" fill="#35d0b2"/><text x="309" y="674" fill="#15354a" font-size="16" font-weight="600">BẢN DUYỆT KHÁCH</text>
