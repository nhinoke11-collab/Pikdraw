  <text x="643" y="228" class="muted small">H</text><rect x="663" y="208" width="106" height="28" rx="4" class="field"/><text x="677" y="228" class="light small">300,00 mm</text>
  <line x1="789" y1="208" x2="789" y2="235" class="stroke"/>
  <text x="811" y="228" class="muted small">Căn chỉnh</text><text x="912" y="228" class="muted small">Phân bố</text><text x="1004" y="228" class="muted small">Boolean ▾</text>
  <text x="1278" y="228" class="muted small">Thuộc tính theo lựa chọn</text>
