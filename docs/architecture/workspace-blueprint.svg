  <text x="203" y="301" class="dark" font-size="10">0</text><text x="303" y="301" class="dark" font-size="10">100</text><text x="403" y="301" class="dark" font-size="10">200</text><text x="503" y="301" class="dark" font-size="10">300</text><text x="603" y="301" class="dark" font-size="10">400</text><text x="703" y="301" class="dark" font-size="10">500</text><text x="803" y="301" class="dark" font-size="10">600</text><text x="903" y="301" class="dark" font-size="10">700</text><text x="1003" y="301" class="dark" font-size="10">800</text><text x="1103" y="301" class="dark" font-size="10">900</text>
  <rect x="98" y="308" width="1150" height="565" fill="#e5e9ef"/>
  <rect x="98" y="308" width="1150" height="565" fill="url(#grid)"/>
  <rect x="98" y="308" width="23" height="565" fill="#d2d8e3"/>
  <path d="M98 370h16m-16 100h16m-16 100h16m-16 100h16m-16 100h16" stroke="#8490a3"/>
  <rect x="224" y="408" width="908" height="337" fill="#b5becc" opacity=".45"/>
  <rect x="218" y="402" width="908" height="337" fill="white"/>
