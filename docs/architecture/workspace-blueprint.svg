  <line x1="1265" y1="552" x2="1542" y2="552" class="stroke"/>
  <text x="1266" y="579" class="light label">Hiệu ứng</text><text x="1266" y="607" class="muted small">+ Thêm hiệu ứng có thể chỉnh sửa</text>
